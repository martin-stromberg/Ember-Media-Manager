name: Build and package
description: >
  Provisions MSBuild, restores "Ember Media Manager.sln" via the repo-pinned NuGet CLI
  (.nuget\NuGet.exe - the legacy packages.config model is not supported by dotnet restore),
  builds it in Release|x64 mode, copies the "EmberMM - Release - x64" output to publish/,
  packages the result as release.zip, and generates the update manifest (update.json:
  SHA-256/size/URL per asset). Used by both the "prerelease" job in staging-ci.yml
  ("Pre-Release") and the "release" job in release.yml, so these build/package/zip/manifest
  steps only exist once instead of being duplicated between them. The NSIS installer
  (BuildSetup/) is deliberately not part of this pipeline - it would require Transifex
  credentials (tx.exe) and makensis on the runner.

inputs:
  release-version:
    description: Version without a leading v, written into version.json and update.json.
    required: false
    default: ''
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1), written into version.json and update.json, and used to build the asset download URL.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: .\.nuget\NuGet.exe restore "Ember Media Manager.sln"
      shell: pwsh

    - name: Stamp assembly version
      # Stamps the resolved release version into the AssemblyInfo.vb attributes of the
      # working copy before MSBuild runs. Legacy (non-SDK) vbproj ignores /p:Version=,
      # so the version attributes only exist in AssemblyInfo.vb. SemVer X.Y.Z maps to
      # assembly version X.Y.Z.0, X.Y.Z-rc.N to X.Y.Z.N; the full SemVer string goes to
      # AssemblyInformationalVersion. The change stays in the CI working copy - it is
      # deliberately not committed back to the repository. The derived values are also
      # exported as step outputs so "Verify publish output" reuses this single
      # SemVer->assembly-version derivation instead of reimplementing it.
      id: stamp-version
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: |
        $version = $env:RELEASE_VERSION
        if (-not $version) {
          Write-Host 'no release version - skipping stamp'
          exit 0
        }
        $version = $version -replace '^v', ''
        if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?$') {
          throw "release-version '$version' does not match the accepted format X.Y.Z or X.Y.Z-rc.N."
        }
        $revision = '0'
        if ($Matches[4]) { $revision = $Matches[4] }
        # Assembly version components max out at 65534 - check here so an out-of-range
        # tag fails with a clear message instead of a cryptic VB compiler error later.
        foreach ($component in @($Matches[1], $Matches[2], $Matches[3], $revision)) {
          if ($component.Length -gt 5 -or [int]$component -gt 65534) {
            throw "release-version '$version' contains the component '$component', which is outside the allowed assembly version range 0-65534."
          }
        }
        $assemblyVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$revision"
        "assembly_version=$assemblyVersion" | Add-Content -Path $env:GITHUB_OUTPUT
        "product_version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

        $assemblyInfoFiles = @(
          'EmberMediaManager/My Project/AssemblyInfo.vb',
          'EmberAPI/My Project/AssemblyInfo.vb'
        )
        foreach ($file in $assemblyInfoFiles) {
          $path = (Resolve-Path $file).Path
          $content = [IO.File]::ReadAllText($path)
          $content = $content -replace '(?m)^<Assembly: AssemblyVersion\("[^"]*"\)', "<Assembly: AssemblyVersion(`"$assemblyVersion`")"
          $content = $content -replace '(?m)^<Assembly: AssemblyFileVersion\("[^"]*"\)', "<Assembly: AssemblyFileVersion(`"$assemblyVersion`")"
          $content = $content -replace '(?m)^<Assembly: AssemblyInformationalVersion\("[^"]*"\)', "<Assembly: AssemblyInformationalVersion(`"$version`")"
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($true))
          Write-Host "Stamped ${file}: AssemblyVersion=$assemblyVersion, AssemblyFileVersion=$assemblyVersion, AssemblyInformationalVersion=$version"
        }
      shell: pwsh

    - name: Build (Release x64)
      run: msbuild "Ember Media Manager.sln" -p:Configuration=Release -p:Platform=x64
      shell: pwsh

    - name: Copy build output to publish
      # Ember Media Manager is not a dotnet-publish-capable app (legacy .NET Framework 4.8
      # vbproj); the documented MSBuild output directory "EmberMM - <Config> - <Platform>"
      # is the release payload instead.
      run: |
        # publish/ must exist as a directory first: copying a wildcard onto a
        # non-existent destination makes Copy-Item create "publish" from the first
        # enumerated item, and a container then fails with
        # "Container cannot be copied onto existing leaf item".
        if (Test-Path 'publish' -PathType Leaf) { Remove-Item 'publish' -Force }
        New-Item -ItemType Directory -Path 'publish' -Force | Out-Null
        Copy-Item -Path 'EmberMM - Release - x64\*' -Destination 'publish' -Recurse -Force
        # Helper for end users: removes the Mark-of-the-Web block from the
        # extracted release files (Get-ChildItem -Recurse | Unblock-File).
        Copy-Item -Path 'scripts/Unblock-ReleaseFiles.ps1' -Destination 'publish' -Force
      shell: pwsh

    - name: Write version manifest
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        $version = $env:RELEASE_VERSION
        $tagName = $env:RELEASE_TAG
        if (-not $tagName) {
          $tagName = "v0.0.0"
        }
        if (-not $version) {
          $version = $tagName -replace '^v', ''
        }
        $version = $version -replace '^v', ''
        $manifest = [ordered]@{
          version = $version
          tagName = $tagName
          commit = $env:GITHUB_SHA
          createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
        }
        $manifest | ConvertTo-Json -Depth 3 | Set-Content -Path 'publish/version.json' -Encoding UTF8
      shell: pwsh

    - name: Verify publish output
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
        EXPECTED_ASSEMBLY_VERSION: ${{ steps.stamp-version.outputs.assembly_version }}
        EXPECTED_PRODUCT_VERSION: ${{ steps.stamp-version.outputs.product_version }}
      run: |
        if (-not (Test-Path 'publish/Ember Media Manager.exe')) {
          throw "publish/ is incomplete: Ember Media Manager.exe is missing."
        }
        if (-not (Test-Path 'publish/version.json')) {
          throw "publish/ is incomplete: version.json is missing."
        }
        if (-not (Test-Path 'publish/Unblock-ReleaseFiles.ps1')) {
          throw "publish/ is incomplete: Unblock-ReleaseFiles.ps1 is missing."
        }
        if ($env:RELEASE_VERSION) {
          # A silent non-matching -replace in "Stamp assembly version" must not ship an
          # unstamped artifact: AssemblyVersion drives the displayed version
          # (My.Application.Info.Version -> Master.Version), FileVersion is what
          # Functions.EmberAPIVersion() reads for the EmberAPI entry in dlgVersions.
          # The expected values come from the stamp step's outputs so the
          # SemVer->assembly-version derivation exists in exactly one place.
          $expectedAssemblyVersion = $env:EXPECTED_ASSEMBLY_VERSION
          $expectedProductVersion = $env:EXPECTED_PRODUCT_VERSION
          if (-not $expectedAssemblyVersion -or -not $expectedProductVersion) {
            throw "release-version '$env:RELEASE_VERSION' is set, but 'Stamp assembly version' exported no assembly_version/product_version outputs."
          }

          $exePath = (Resolve-Path 'publish/Ember Media Manager.exe').Path
          $exeInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($exePath)
          $exeAssemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($exePath).Version
          if ($exeInfo.FileVersion -ne $expectedAssemblyVersion) {
            throw "Ember Media Manager.exe FileVersion '$($exeInfo.FileVersion)' does not match expected '$expectedAssemblyVersion'."
          }
          if ($exeAssemblyVersion -ne [version]$expectedAssemblyVersion) {
            throw "Ember Media Manager.exe AssemblyVersion '$exeAssemblyVersion' does not match expected '$expectedAssemblyVersion'."
          }
          if ($exeInfo.ProductVersion -ne $expectedProductVersion) {
            throw "Ember Media Manager.exe ProductVersion '$($exeInfo.ProductVersion)' does not match expected '$expectedProductVersion'."
          }

          $dllPath = (Resolve-Path 'publish/EmberAPI.dll').Path
          $dllInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($dllPath)
          $dllAssemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dllPath).Version
          if ($dllInfo.FileVersion -ne $expectedAssemblyVersion) {
            throw "EmberAPI.dll FileVersion '$($dllInfo.FileVersion)' does not match expected '$expectedAssemblyVersion'."
          }
          if ($dllAssemblyVersion -ne [version]$expectedAssemblyVersion) {
            throw "EmberAPI.dll AssemblyVersion '$dllAssemblyVersion' does not match expected '$expectedAssemblyVersion'."
          }
          Write-Host "Verified stamped versions: AssemblyVersion/FileVersion=$expectedAssemblyVersion, ProductVersion=$expectedProductVersion"
        }
      shell: pwsh

    - name: Create Release ZIP
      run: Compress-Archive -Path publish/* -DestinationPath release.zip -Force
      shell: pwsh

    - name: Create update manifest
      # Update manifest (SHA-256, size, download URL per asset). This is a separate GitHub
      # release asset alongside release.zip.
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        $version = $env:RELEASE_VERSION
        $tag = $env:RELEASE_TAG
        if (-not $tag) {
          $tag = "v0.0.0"
        }
        if (-not $version) {
          $version = $tag -replace '^v', ''
        }
        $version = $version -replace '^v', ''

        $zipPath = 'release.zip'
        $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
        $size = (Get-Item $zipPath).Length
        $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/release.zip"

        $manifest = [ordered]@{
          version      = $version
          releaseNotes = "Ember Media Manager release $tag"
          publishedAt  = (Get-Date).ToUniversalTime().ToString('o')
          assets       = @(
            [ordered]@{
              platform          = "windows"
              runtimeIdentifier = "win-x64"
              assetName         = "release.zip"
              assetUrl          = $assetUrl
              sha256            = $hash
              sizeBytes         = $size
            }
          )
        }
        $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path 'update.json' -Encoding UTF8
      shell: pwsh
